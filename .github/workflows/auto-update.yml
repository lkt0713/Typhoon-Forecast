name: Auto update forecast

# 在 GitHub 的雲端機器上每 10 分鐘跑一次 forecast.py，取代本機的
# run_forecast.bat + 工作排程器，電腦關機時網站照樣更新。
#
# 注意：用 GITHUB_TOKEN 推送的 commit 不會觸發其他 workflow（GitHub 刻意
# 防止無限迴圈），所以 deploy-pages.yml 不會被這裡的 push 叫起來，
# 部署改在本 workflow 的 deploy job 直接做。

on:
  schedule:
    # 避開整點與半點：GitHub 排程在 :00 最壅塞，常延遲甚至被丟掉
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    # 上一輪的 update 還沒跑完時，新的一輪排隊等，不要兩輪同時改 docs/。
    # 只鎖 update 這個 job，不鎖整輪：Pages 部署排隊卡住時（2026-10-22 等了 20 分鐘），
    # 下一輪的預報照樣跑，網站等部署恢復後由最新一輪的 deploy 一次補上
    # group 名稱不用舊的 auto-update：2026-10-22 13:46 那輪成了幽靈（job 全結束、run 卻永遠
    # in_progress，取消 API 回「not in progress」），一直佔著 auto-update 這個 group，
    # 之後同名的都排不進去
    concurrency:
      group: forecast-update
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          # 只抓最新一個 commit，不拉數 GB 的圖檔歷史
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib requests scipy shapely pillow cartopy pdbufr eccodes ecmwf-opendata netCDF4 copernicusmarine

      # 下載目錄在 .gitignore 裡不進 repo；用 cache 在各輪之間保留，
      # _resolve_cycle 回溯舊 cycle 與潛勢圖的退路才有檔案可用。
      # 還原與儲存分開：以前每輪都用 run_id 存一份新 key（約 93 MB），改成 10 分鐘
      # 一輪後一天 144 份、遠超過 10 GB 上限而一直被淘汰（2026-10-16 已 115 份／10.75 GB）。
      # 現在 key 取下載目錄檔案清單的雜湊，內容沒變就不重存；還原時取最新一份。
      - name: Restore download cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            deepmind_weather_*_2026/
            ecmwf_*_2026/
            noaa_*_2026/
            ~/.local/share/cartopy
          # 前綴的 v2 是快取版本：快取內容壞掉時改這裡就能整批作廢（v1 裡有
          # pandas 3 修正前寫下的「ECMWF 18Z 無颱風」潛勢檔，會讓程式不再重抓 BUFR）
          key: forecast-data-v2-restore
          restore-keys: forecast-data-v2-

      - name: Run forecast
        # 網頁上的「最後更新」用機器本地時間（datetime.now().astimezone()），
        # runner 預設 UTC，設成台北時間才跟本機版顯示的一樣
        # 單步上限：某次下載卡住時讓這一步自己失敗，接力照常接下一輪，
        # 不必等整個 job 的 40 分鐘上限
        timeout-minutes: 25
        env:
          TZ: Asia/Taipei
          # 選用：氣象署官方預報、CMEMS 海洋熱含量；沒設 secret 時各自略過或改用備援來源
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python forecast.py

      - name: Compute cache key
        id: cachekey
        run: |
          h=$(find deepmind_weather_*_2026 ecmwf_*_2026 noaa_*_2026 -type f -printf '%p %s\n' 2>/dev/null | sort | sha256sum | cut -c1-16)
          echo "key=forecast-data-v2-$h" >> "$GITHUB_OUTPUT"

      - name: Save download cache
        if: steps.cachekey.outputs.key != steps.restore.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            deepmind_weather_*_2026/
            ecmwf_*_2026/
            noaa_*_2026/
            ~/.local/share/cartopy
          key: ${{ steps.cachekey.outputs.key }}

      - name: Commit and push docs
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "[INFO] No changes in docs/, skipping push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Auto update: $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # 有人在這輪期間推了新 commit：多抓一點歷史讓 rebase 找得到共同祖先
            git fetch --depth=20 origin main
            git rebase origin/main || { git rebase --abort; echo "[ERROR] rebase conflict"; exit 1; }
            sleep $((i * 10))
          done
          echo "[ERROR] push failed after retries"
          exit 1

      # 每週把 main 壓成單一 commit：docs/ 每 10 分鐘重產一次圖檔，歷史只增不減
      # （2026-10 已達 16 GB）。上次壓縮的 commit 以 tag squash-base 標記，滿 7 天
      # 才再壓。放在這個 job 裡而非獨立 workflow：同一 concurrency group 的獨立
      # workflow 排隊時會把接力排進來的下一輪擠掉（pending 只留一個）。
      # --force-with-lease：這段期間若有人推了新 commit 就放棄，下一輪再試。
      # 舊歷史無法復原；本機 clone 由 push_to_github.bat 偵測後自動對齊。
      - name: Squash history weekly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base=$(git ls-remote origin refs/tags/squash-base | cut -f1)
          if [ -n "$base" ]; then
            when=$(gh api "repos/$GH_REPO/git/commits/$base" -q .committer.date)
            age=$(( $(date +%s) - $(date -d "$when" +%s) ))
            if [ "$age" -lt 604800 ]; then
              echo "[INFO] Last squash $when, not due yet"
              exit 0
            fi
          fi
          git fetch -q --depth=1 origin main
          tip=$(git rev-parse origin/main)
          new=$(git commit-tree "$tip^{tree}" \
            -m "History squashed: $(date -u '+%Y-%m-%d %H:%M') UTC (weekly)")
          if git push --force-with-lease=main:"$tip" origin "$new:refs/heads/main"; then
            git push -f origin "$new:refs/tags/squash-base"
            echo "[INFO] Squashed main to $new"
          else
            echo "[WARN] main moved during squash, will retry next run"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 不取消進行中的部署：部署排隊比 10 分鐘還久時，取消會讓每一輪都被下一輪砍掉、網站永遠更新不了。
    # 進行中的跑完；排隊中的只留最新一輪（GitHub 對同一 group 只保留一個 pending）
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # 備援接力：GitHub 的 schedule 常延遲或整輪跳過（本 workflow 加入後連續五輪
  # 都沒被排程觸發），所以每輪結束時自己排好下一輪：等到本輪開始後約 10 分鐘（實際工作約 7～15 分鐘，跑超過就立刻接下一輪），
  # 再用 workflow_dispatch 叫起下一輪（GITHUB_TOKEN 觸發 workflow_dispatch 是
  # GitHub 允許的例外）。schedule 仍保留，接力斷掉時靠它接回來。
  chain:
    # 不等 deploy：部署卡住不該拖住下一輪預報
    needs: update
    # 本輪失敗也要接力，否則一次下載失敗整條鏈就斷了
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
    steps:
      - name: Wait, then queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          started=$(gh run view ${{ github.run_id }} --json createdAt -q .createdAt)
          wait=$(( $(date -d "$started" +%s) + 600 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then
            echo "[INFO] Sleeping ${wait}s until the next slot"
            sleep "$wait"
          fi
          # 已經有比本輪新的一輪在排隊或執行（排程恢復了、或有人手動觸發）就不再加一輪，
          # 避免同時跑出兩條接力鏈。只看比本輪新的：舊的那輪可能只剩 deploy 還在排隊，
          # 它的接力早就發出去了（就是本輪），不能因為它沒結束就不接
          # 只算 30 分鐘內建立的：GitHub 偶爾留下永遠 queued、取消也刪不掉的幽靈
          # run（2026-10-19 13:40 那輪），若照算，每輪都以為「已有別輪在排」而不接，
          # 整條鏈就斷在那裡
          others=$(gh run list --workflow auto-update.yml --limit 20 \
            --json databaseId,status,createdAt \
            -q "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != \"completed\") | select(.createdAt > \"$started\") | select((now - (.createdAt | fromdateiso8601)) < 1800)] | length")
          if [ "$others" -gt 0 ]; then
            echo "[INFO] Another run is already queued or running, not chaining"
            exit 0
          fi
          # GitHub API 偶爾回 5xx（10-07 一次 HTTP 500 就讓整條鏈斷了一天），
          # 失敗就退避重試
          for i in 1 2 3 4 5 6; do
            if gh workflow run auto-update.yml --ref main; then
              echo "[INFO] Queued the next run"
              exit 0
            fi
            echo "[WARN] dispatch failed (attempt $i), retrying"
            sleep $((i * 30))
          done
          echo "[ERROR] could not queue the next run"
          exit 1
